# Reverse proxy do CloudFront (porta 80, sempre HTTP — a origem nunca recebe
# HTTPS diretamente, ver deploy/README.md) para o container Next.js na porta
# 3000 (hostname de serviço `frontend` na rede do Compose, ver
# deploy/docker-compose.frontend.yml).

server {
    listen 80;
    server_name _;

    # Uploads de vídeo aceitos pelo backend vão até MAX_UPLOAD_SIZE_VIDEO_MB
    # (backend/app/utils/upload_validation.py, default 200MB). O default do
    # Nginx (1m) rejeitaria esses uploads com 413 antes de chegar ao Next.js.
    # 220M dá margem sobre o limite atual.
    client_max_body_size 220M;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Fixado como "https", não derivado de $scheme: a conexão
        # CloudFront→Nginx é sempre HTTP (Origin Protocol Policy = HTTP
        # Only), então $scheme aqui sempre valeria "http", mascarando o
        # protocolo real usado pelo usuário (sempre HTTPS via CloudFront).
        # Seguro fixar porque o Security Group desta instância só aceita
        # tráfego na porta 80 vindo do prefix list gerenciado do CloudFront
        # (com.amazonaws.global.cloudfront.origin-facing) — não existe
        # caminho de acesso direto por HTTP puro que tornaria esse valor
        # incorreto.
        proxy_set_header X-Forwarded-Proto https;

        # Alongados sobre o default (60s): upload grande + processamento no
        # backend (ex. remoção de fundo via rembg) podem passar do default
        # antes do backend responder.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
