  # a pergunta irrespondível. O sistema DEVE recusar todas.
  - id: oos-dieta-restritiva
    question: "Como se comporta a tilápia do nilo com dieta restritiva?"
    scope: out_of_corpus
    question_type: conceptual
    expected_source_file: null
    expected_passages: []
    must_mention: []
    # A falha observada ao vivo nesta investigação: o sistema não recusou,
    # respondeu com um esqueleto de seções vazias e citou os 4 documentos
    # da base com quase todo o intervalo de páginas.

  - id: oos-fis-carpa
    question: "Qual o coeficiente de endogamia FIS das populações de carpa capim no banco de germoplasma?"
    scope: out_of_corpus
    question_type: quantitative
    expected_source_file: null
    expected_passages: []
    must_mention: []
    # Troca de entidade mantendo vocabulário técnico idêntico ao do corpus
    # (FIS, endogamia, banco de germoplasma, populações) — o corpus fala de
