    question_type: methodological
    expected_source_file: null
    expected_passages: []
    must_mention: []

  # ------------------------------------------------------- fora do escopo (adversariais)
  # As 4 acima são lexicalmente distantes do corpus — o sistema pode recusar
  # por sorte, não por entender que não sabe. Estas reusam vocabulário,
